    watch: ["Гаррі Поттер"]
    any: ["таємна кімната", "chamber of secrets"]
  - name: "Поттер: В'язень Азкабану"
    watch: ["Гаррі Поттер"]
    any: ["азкабану", "azkaban"]
  - name: "Поттер: Келих вогню"
    watch: ["Гаррі Поттер"]
    any: ["келих вогню", "кубок вогню", "goblet of fire"]
  - name: "Поттер: Орден Фенікса"
    watch: ["Гаррі Поттер"]
    any: ["орден фенікса", "order of the phoenix"]
  - name: "Поттер: Напівкровний Принц"
    watch: ["Гаррі Поттер"]
    any: ["напівкровний", "half-blood"]
  - name: "Поттер: Смертельні реліквії"
    watch: ["Гаррі Поттер"]
    any: ["смертельні реліквії", "дари смерті", "deathly hallows"]
  - name: "Поттер: Прокляте дитя"
    watch: ["Гаррі Поттер"]
    any: ["прокляте дитя", "cursed child"]
