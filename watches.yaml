    all: ["вежа ласт"]
  - name: "Відьмак: Володарка Озера"
    watch: ["Відьмак"]
    all: ["володарка озера"]
  - name: "Відьмак: Сезон гроз"
    watch: ["Відьмак"]
    all: ["сезон гроз"]

  # ── Дж. К. Ролінґ ─────────────────────────────────────────────────────────
