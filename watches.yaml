# Список того, за чим стежимо.
# Кожен watch = одна сторінка пошуку OLX з уже застосованими фільтрами.
#
# ⚠ Наразі всюди max_price: 2000 — це тимчасова спільна заглушка.
#   Це верхня межа в гривнях: дорожче не турбує. Поставте своє число
#   для кожного пошуку окремо, коли буде зрозуміло, скільки що коштує.

defaults:
  currency: UAH          # порівнюємо ціни лише в цій валюті
  pages: 1               # скільки сторінок пошуку читати (1 достатньо при сортуванні за датою)
  skip_promoted: false   # true = ігнорувати "просунуті" (платно підняті) оголошення
  allow_similar: false   # true = враховувати підмішані OLX-ом "схожі" результати
  allow_no_price: false  # true = сповіщати й про оголошення без ціни (обмін/договірна)
  min_drop_percent: 3    # падіння ціни менше за 3% ігноруємо (щоб не смикало на копійки)
  prune_days: 30         # забути оголошення, яких не бачили N днів
  # Паузи. Вони — головна стаття часу прогону: 22 watch'і × 4 с ≈ 84 с, тобто
  # більше, ніж уся корисна робота. Числа спершу поставили з обережності, а не
  # з вимірювання; `py probe.py --rate` показує, що OLX насправді терпить.
  pause_between_watches: 3
  pause_jitter: 2              # + випадкові 0..N с, щоб ритм не був машинним
  description_pause: 0.4       # сторінка оголошення легша за сторінку пошуку
  sold_report_pause: 1.5       # до 60 перевірок за годинний прогін

  # --- Шар правил: кому Telegram, кому лише база (rules.py) ---------------
  # Три різні речі, які раніше вирішував один max_price:
  #   max_price             — до якої ціни оголошення взагалі зберігається;
  #                           усе, що дорожче, не потрапляє навіть у статистику.
  #   notify_max_price      — до якої ціни про нього ще й пишемо в Telegram.
  #   notify_min_price_high — …або навпаки: дорожче за це шлемо окремим типом
  #                           повідомлення («скільки за це взагалі просять»).
  # Не задано notify_max_price — поводимось як до 2026-09-22: зберегли = написали.
  notify_max_price: null
  notify_min_price_high: null

  # Опис оголошення коштує окремий HTTP-запит, бо у видачі його немає. Вмикати
  # лише там, де від нього залежить рішення (видавництво, склад лоту).
  needs_description: true
  description_max_fetch: 40    # ліміт НА ПРОГІН у сумі, а не на кожен watch

  # Слова, які вбивають оголошення повністю (не зберігати навіть для
  # статистики). На відміну від exclude_keywords дивляться і в опис.
  drop_keywords: []
  drop_russian: false          # відкидати російськомовні оголошення й видавництва

  # Мова оголошення. Потрібні тільки українські видання: і в російських, і в
  # англомовних свій ринок і свої ціни, тож у спільній статистиці вони лише
  # зсувають медіану. Тому не зберігаємо навіть для історії (рішення
  # 2026-09-23; до того російські були «зберігаємо, але мовчимо»).
  #
  # Англійську визначаємо за ЧАСТКОЮ латиниці в описі, а не за окремими
  # словами: «Black House Stephen King Чорний дім Стівен Кінг» — це звичайне
  # українське оголошення, і перевірка «є латиниця» викинула б половину видачі.
  drop_russian: true
  drop_english: true

  # Комплект: показати варто, рахувати по ньому медіану — ні.
  bundle_notify: false         # слати комплект попри пороги ціни
  bundle_analytics: true       # чи брати комплект у статистику

  # --- Аналітика цін (analytics.py) --------------------------------------
  # Раз на добу рахуємо, за скільки книжки реально розходяться, і шлемо
  # один звіт. Ці ж числа дають коментар до кожного нового оголошення.
  analytics_enabled: true
  analytics_window_days: 30    # глибина історії проданих
  stalled_days: 14             # з якого віку оголошення вважаємо «лежить»
  stalled_seen_hours: 48       # …і воно має бути у видачі, інакше просто зникло
  sold_max_age_days: 45        # знято пізніше — радше архів OLX, ніж продаж
  min_sold: 4                  # менше спостережень — «не вдалося визначити»
  min_stalled: 3               # менше — межу «задорого» не рахуємо
  analytics_min_price: 20      # дешевше — сміття, у статистику не бере
  report_max_books: 28         # скільки позицій влазить в одне повідомлення
  daily_report_hour: 9         # о котрій слати звіт (за Києвом); false — вимкнути
  daily_report_tz: "Europe/Kyiv"

  # Звіт про зняті оголошення: раз на годину перевіряємо ті, що зникли з
  # видачі, і повідомляємо про ті, яких уже немає на сайті (HTTP 410).
  # Це найближче до «продано», що OLX узагалі дає.
  sold_report_minutes: 60      # 0 або false — вимкнути звіт
  sold_report_max_checks: 60   # скільки посилань перевіряти за один звіт
  # Оголошення старші за стільки днів не перевіряємо взагалі: якщо воно
  # пролежало два тижні, питання «продалось?» уже не цікаве, а черга
  # перевірок забивається саме такими довгожителями (вони зникли з
  # видачі найдавніше, тож стоять у ній першими).
  sold_check_max_age_days: 14

  # Мерч і не-книги. Цей список ДОДАЄТЬСЯ до того, що вказано в окремому watch,
  # а не замінює його. Збіг шукається в заголовку, регістр не має значення,
  # тому корені без закінчень ловлять усі відмінки: "фігурк" → фігурка, фігурки, фігурку.
  exclude_keywords:
    - фігурк
    - паличк
    - шарф
    - значок
    - значк
    - постер
    - косплей
    - кружк
    - чашк
    - брелок
    - футболк
    - наклейк
    - лего
    - пазл
    - ps4
    - ps5
    - xbox
    - nintendo
    - плакат

  # Російськомовні видання не потрібні (рішення 2026-09-19). Тут — лише явні
  # мовні маркери в заголовку; самі російські назви прибрані з include_keywords
  # кожного watch, а російські написання авторів — у їхніх exclude.
    - російською
    - російськ
    - "рос. мов"
    - "рос.мов"
    - "(рос)"
    - русск
    - на русском

# ─────────────────────────────────────────────────────────────────────────────
# Каталог книг для аналітики цін (analytics.py)
#
# Навіщо. Статистику «за скільки беруть» треба рахувати по КНИЖЦІ, а не по
# пошуку: у watch «Гаррі Поттер» лежить і один том за 150 грн, і семитомник
# за 6500. Медіана по такій купі не описує жодного реального оголошення.
#
# Як працює. Для кожного оголошення перебираємо цей список ЗВЕРХУ ВНИЗ і
# беремо ПЕРШИЙ збіг. Тому конкретніші позиції («Колонія + Колапс») мають
# стояти вище за загальніші («Колонія»). Якщо не збіглось нічого — книгою
# вважається назва watch'а; так і задумано для тих пошуків, де книжка й так
# одна (Кінг, Клер).
#
# Поля позиції:
#   name    — як показувати у звіті (і ключ статистики);
#   watch   — необов'язково: шукати лише в цих watch'ах (за їхнім name);
#   all     — УСІ ці корені мають бути в заголовку (регістр не має значення);
#   any     — хоча б ОДИН із цих коренів;
#   not     — жодного з цих;
#   bundle  — позиція сама по собі про комплект (інакше комплекти цієї книжки
#             автоматично їдуть у «<name> · комплект», окремою статистикою).
#
# Корені без закінчень («колоні») ловлять усі відмінки. Російські написання
# сюди не додаємо: російськомовні видання analytics відкидає окремо.
books:

  # ── Макс Кідрук ───────────────────────────────────────────────────────────
  - name: "Кідрук: Колонія + Колапс"
    watch: ["Макс Кідрук"]
    all: ["колоні", "колапс"]
    bundle: true
    notify_max: 300
  - name: "Кідрук: Колонія"
    watch: ["Макс Кідрук"]
    all: ["колоні"]
    notify_max: 300
  - name: "Кідрук: Колапс"
    watch: ["Макс Кідрук"]
    all: ["колапс"]
    notify_max: 300
  - name: "Кідрук: Твердиня"
    watch: ["Макс Кідрук"]
    all: ["твердин"]
    notify_max: 500        # цінна книжка — дешевше 500 пишемо одразу
  - name: "Кідрук: Бот. Атакамська криза"
    watch: ["Макс Кідрук"]
    all: ["атакамськ"]
    notify_max: 500        # цінна книжка — дешевше 500 пишемо одразу
  - name: "Кідрук: Бот. Гуаякільський парадокс"
    watch: ["Макс Кідрук"]
    all: ["гуаякіл"]
    notify_max: 500        # цінна книжка — дешевше 500 пишемо одразу
  - name: "Кідрук: Бот"
    watch: ["Макс Кідрук"]
    all: ["бот"]
    not: ["робот", "ботан", "ботані"]
    notify_max: 500        # цінна книжка — дешевше 500 пишемо одразу
  - name: "Кідрук: Доки світло не згасне назавжди"
    watch: ["Макс Кідрук"]
    all: ["доки світло"]
    notify_max: 500        # цінна книжка — дешевше 500 пишемо одразу
  - name: "Кідрук: Жорстоке небо"
    watch: ["Макс Кідрук"]
    all: ["жорстоке небо"]
  - name: "Кідрук: Не озирайся і мовчи"
    watch: ["Макс Кідрук"]
    all: ["не озирайся"]
  - name: "Кідрук: Зазирни у мої сни"
    watch: ["Макс Кідрук"]
    all: ["зазирни"]
  - name: "Кідрук: Небратні"
    watch: ["Макс Кідрук"]
    all: ["небратні"]
  - name: "Кідрук: Теорія неймовірності"
    watch: ["Макс Кідрук"]
    all: ["теорія неймовір"]
  - name: "Кідрук: На Зеландію"
    watch: ["Макс Кідрук"]
    all: ["зеландію"]
  - name: "Кідрук: Подорож на Пуп Землі"
    watch: ["Макс Кідрук"]
    all: ["пуп землі"]
  - name: "Кідрук: Мексиканські хроніки"
    watch: ["Макс Кідрук"]
    any: ["мексиканські хроніки", "навіжені в мексиці"]

  # ── Роберт Ґалбрейт (Корморан Страйк) ─────────────────────────────────────
  - name: "Ґалбрейт: Кувала зозуля"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    any: ["кувала зозуля", "кличе зозуля", "cuckoo"]
  - name: "Ґалбрейт: Шовкопряд"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["шовкопряд"]
  - name: "Ґалбрейт: На службі зла"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["на службі зла"]
  - name: "Ґалбрейт: Убивчий білий"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    any: ["убивчий біл", "lethal white"]
  - name: "Ґалбрейт: Бентежна кров"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["бентежна кров"]
  - name: "Ґалбрейт: Чорнильно-чорне серце"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["чорнильно"]
  - name: "Ґалбрейт: Стрімка могила"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["стрімка могил"]
  - name: "Ґалбрейт: Людина з клеймом"
    watch: ["Роберт Ґалбрейт (Страйк)"]
    all: ["людина з клеймом"]

  # ── Стівен Кінг: лише ті книжки, у яких є власні пороги ──────────────────
  # Решті Кінга каталог не потрібен: там watch і так дорівнює книжці.
  #
  # «Протистояння» виходило двома томами, і за пару просять удвічі більше, ніж
  # за один. Збираємо статистику по всьому, а пишемо лише про справді дешеве:
  # до 350 за том, до 700 за комплект.
  - name: "Кінг: Протистояння"
    any: ["протистояння", "the stand"]
    notify_max: 350
    notify_max_bundle: 700
  - name: "Кінг: Безсоння"
    any: ["безсоння", "insomnia"]

  # ── Сюзанна Коллінз ───────────────────────────────────────────────────────
  - name: "Коллінз: Світанок перед Жнивами"
    any: ["світанок перед жнивам", "sunrise on the reaping"]
    notify_max: 199

  # ── Ренсом Ріггз (два watch'і дають одні й ті самі книжки — тут зливаються)
  - name: "Ріггз: Дім дивних дітей · цикл"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["дивних"]
    any: ["комплект", "цикл", "серія", "серії", "3 книг", "трьох книг", "всі книги"]
    bundle: true
  - name: "Ріггз: Місто порожніх"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["місто порожніх"]
  - name: "Ріггз: Бібліотека душ"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["бібліотека душ"]
  - name: "Ріггз: Карта днів"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["карта днів"]
  - name: "Ріггз: Розмова з птахами"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["розмова з птах"]
  - name: "Ріггз: Спустошення Диявольського акра"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    any: ["спустошення", "диявольського акра", "диявольского акра"]
  - name: "Ріггз: Казки про дивних"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    all: ["казки про дивних"]
  - name: "Ріггз: Надзвичайні розчарування Леопольда Беррі"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    any: ["леопольда беррі", "надзвичайні розчарування"]
  - name: "Ріггз: Дім дивних дітей"
    watch: ["Ренсом Ріггз (автор)", "Ріггз: Дім дивних дітей (за серією)"]
    any: ["дім дивних", "дому дивних", "будинок дивних"]

  # ── Анджей Сапковський: лишилась одна книжка ─────────────────────────────
  - name: "Відьмак: Вежа Ластівки"
    any: ["вежа ластівки", "вежа ласт", "tower of the swallow"]

  # ── Кассандра Клер, «Знаряддя смерті» ─────────────────────────────────────
  # Сім окремих пошуків зведені в один (`q-кассандра-клер`, 3 сторінки), тому
  # книжку тепер розрізняє каталог, а не назва watch'а. Заміряно 2026-09-22:
  # один цей запит на трьох сторінках дає 18 із 19 потрібних оголошень, а
  # єдине втрачене — комплект за 2000 грн, тобто поза межею зберігання.
  #
  # «Місто кісток» уже є, тому окрема книжка не потрібна — але комплект, у
  # якому вона разом з іншими, потрібен. Звідси `not:` замість стоп-слова.
  - name: "Клер: Місто кісток (уже є)"
    all: ["місто кісток"]
    not: ["місто попелу", "місто скла", "місто впалих", "місто грішних",
          "місто загублених", "місто небесного", "комплект", "набір", "цикл"]
    skip: true
  - name: "Клер: Місто попелу"
    any: ["місто попелу", "city of ashes"]
  - name: "Клер: Місто скла"
    any: ["місто скла", "city of glass"]
  - name: "Клер: Місто впалих янголів"
    any: ["місто впалих", "місто грішних", "city of fallen"]
  - name: "Клер: Місто загублених душ"
    any: ["місто загублених", "city of lost"]
  - name: "Клер: Місто небесного вогню"
    any: ["місто небесного", "city of heavenly"]

  # ── Дж. К. Ролінґ ─────────────────────────────────────────────────────────
  - name: "Поттер: Філософський камінь"
    watch: ["Гаррі Поттер"]
    any: ["філософський камінь", "philosopher's stone"]
  - name: "Поттер: Таємна кімната"
    watch: ["Гаррі Поттер"]
    any: ["таємна кімната", "chamber of secrets"]
  - name: "Поттер: В'язень Азкабану"
    watch: ["Гаррі Поттер"]
    any: ["азкабану", "azkaban"]
  - name: "Поттер: Келих вогню"
    watch: ["Гаррі Поттер"]
    any: ["келих вогню", "кубок вогню", "goblet of fire"]
  - name: "Поттер: Орден Фенікса"
    watch: ["Гаррі Поттер"]
    any: ["орден фенікса", "order of the phoenix"]
  - name: "Поттер: Напівкровний Принц"
    watch: ["Гаррі Поттер"]
    any: ["напівкровний", "half-blood"]
  - name: "Поттер: Смертельні реліквії"
    watch: ["Гаррі Поттер"]
    any: ["смертельні реліквії", "дари смерті", "deathly hallows"]
  - name: "Поттер: Прокляте дитя"
    watch: ["Гаррі Поттер"]
    any: ["прокляте дитя", "cursed child"]
    notify_max: 180
    store_max: 250         # дорожче — навіть у статистику не беремо
  - name: "Поттер: Фантастичні звірі"
    watch: ["Гаррі Поттер"]
    all: ["фантастичні звірі"]

  # ── Айзек Азімов ──────────────────────────────────────────────────────────
  - name: "Азімов: Фундація та імперія"
