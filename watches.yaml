    max_price: 2000

  # ── Букфлі ────────────────────────────────────────────────────────────────
  # Один запит за прогін: /search?pageSize=48 — це найновіші 48 оголошень.
  # Перевірено 2026-09-17: сторінка віддає суворо від найновіших до найстаріших
  # (дати створення спадають), а нові книжки додаються приблизно по 2 на годину.
  # Тобто за 15 хвилин вікно з 48 позицій не встигне провернутись і за добу.
  #
  # mode: search — альтернатива: окремий запит на кожне ключове слово. Бачить
  # увесь каталог (2400+ оголошень), а не лише свіжину, але це 9 запитів
  # замість одного, тому з ним варто ставити interval_minutes: 60.
  - name: "Букфлі"
    source: bookflea
    mode: latest
    page_size: 48
    use_default_excludes: false   # мерч-фільтр з defaults тут зайвий: це книгарня
    keywords:
      - Роналду
      - Відьмак
      - Бункер
      - Ден Браун
      - Азімов
      - Фундація
      - Служниця
      - Кідрук
      - Гаррі Поттер
    max_price: 2000        # спільна межа-заглушка, потім налаштуєте

# Шпаргалка по параметрах watch:
#   max_price / min_price   межі ціни в гривнях
#   include_keywords        має збігтися хоча б одне слово в заголовку
#   exclude_keywords        додається до списку з defaults вище
#   cities: ["Київ"]        лише ці міста
#   pages: 2                читати більше сторінок
#   enabled: false          тимчасово вимкнути цей пошук
