# Список того, за чим стежимо.
# Кожен watch = одна сторінка пошуку OLX з уже застосованими фільтрами.
# Найпростіший спосіб отримати url: налаштуйте пошук на сайті руками
# (категорія, регіон, ціна, сортування "від найновіших") і скопіюйте адресу.

defaults:
  currency: UAH          # порівнюємо ціни лише в цій валюті
  pages: 1               # скільки сторінок пошуку читати (1 достатньо при сортуванні за датою)
  skip_promoted: false   # true = ігнорувати "просунуті" (платно підняті) оголошення
  allow_similar: false   # true = враховувати підмішані OLX-ом "схожі" результати
  allow_no_price: false  # true = сповіщати й про оголошення без ціни (обмін/договірна)
  min_drop_percent: 3    # падіння ціни менше за 3% ігноруємо (щоб не смикало на копійки)
  prune_days: 30         # забути оголошення, яких не бачили N днів
  pause_between_watches: 3

watches:
  - name: "Фундація (Азімов)"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D1%84%D1%83%D0%BD%D0%B4%D0%B0%D1%86%D1%96%D1%8F/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 600
    exclude_keywords: ["копія", "репринт", "друк на замовлення", "електронна"]
    # include_keywords: ["азімов", "азимов"]   # якщо задано — має збігтися хоч одне
    # cities: ["Київ", "Львів"]
    # min_price: 50

