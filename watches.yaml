  # ── Букфлі ────────────────────────────────────────────────────────────────
  # mode: search — окремий запит на кожне ключове слово, одинадцять за прогін.
  #
  # Чому НЕ mode: latest (один запит за найновішими). Перевірено 2026-09-17:
  # з України сторінка /search віддає свіжину (оголошення того ж дня), а з
  # американських адрес GitHub Actions — зріз приблизно 14-годинної давнини.
  # Кешу немає (x-vercel-cache: MISS, no-store), маршрут інший — але набір
  # даних інший теж. Тобто «вікно найновіших» на runner'і показує вчорашній
  # день, і нові книжки в нього просто не потрапляють.
  #
  # Пошук за словом від порядку видачі не залежить узагалі: книжка знайдеться
  # хоч у свіжому зрізі, хоч у вчорашньому.
  #
  # Ціна — 11 запитів за прогін замість одного, тому перевіряємо раз на 30 хв,
  # а не щоразу разом з OLX: ~530 запитів і ~55 МБ на добу. Для книжок, які
  # висять тижнями, півгодини затримки нічого не міняють.
  # Між запитами пауза 2.5-4 с, паралельно нічого не шлеться.
  # Якщо сайт колись почне віддавати 403 — підняти до 60.
  - name: "Букфлі"
    source: bookflea
    mode: search
    interval_minutes: 30
    page_size: 24
    use_default_excludes: false   # мерч-фільтр з defaults тут зайвий: це книгарня
    keywords:
      - Роналду
      - Відьмак
      - Бункер
      - Ден Браун
      - Азімов
      - Фундація
      - Служниця
      - Кідрук
      - Гаррі Поттер
      # Кінг і Ріггз — одним словом за прізвищем, а не дев'ятьма назвами.
      # Перевірка на Букфлі локальна й підрядкова по «автор + назва», тож
      # прізвище ловить усі книжки автора одним запитом. Кінг там трапляється
      # рідко, і платити за точність вісьмома зайвими запитами не варто:
      # заміряно 2026-09-19 — «Кінг» дає 18 карток, з них 11 Стівена Кінга,
      # решта чужі, і жодної з восьми потрібних назв у каталозі взагалі немає.
      - Кінг
      - Ріггз
    # Чужі автори, що лізуть на слово «Кінг». Фільтр дивиться в «назва + автор»
    # (тому й «кінгфішер» спрацьовує, хоч у назві книжки його немає).
    exclude_keywords:
      - кінгфішер
      - векс кінг
      - кінгстон
    max_price: 2000        # спільна межа-заглушка, потім налаштуєте

    # Пульс: коротке «живий, нічого нового» в Telegram, коли прогін порожній,
    # і окреме ⚠️ коли перевірка впала. Букфлі крутиться вдома Планувальником
    # Windows, і без пульсу «немає книжок» і «скрапер тиждень як зламався»
    # виглядають однаково — ніяк.
    #   0 — щоразу (зараз так: обкатуємо)
    #   6 — не частіше ніж раз на 6 годин
    #   прибрати рядок — пульсу немає
    heartbeat_hours: 0

# Шпаргалка по параметрах watch:
#   max_price / min_price   межі ціни в гривнях
#   include_keywords        має збігтися хоча б одне слово в заголовку
#   exclude_keywords        додається до списку з defaults вище
#   cities: ["Київ"]        лише ці міста
#   pages: 2                читати більше сторінок
#   enabled: false          тимчасово вимкнути цей пошук
