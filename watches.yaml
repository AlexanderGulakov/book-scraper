# Список того, за чим стежимо.
# Кожен watch = одна сторінка пошуку OLX з уже застосованими фільтрами.
#
# ⚠ Наразі всюди max_price: 2000 — це тимчасова спільна заглушка.
#   Це верхня межа в гривнях: дорожче не турбує. Поставте своє число
#   для кожного пошуку окремо, коли буде зрозуміло, скільки що коштує.

defaults:
  currency: UAH          # порівнюємо ціни лише в цій валюті
  pages: 1               # скільки сторінок пошуку читати (1 достатньо при сортуванні за датою)
  skip_promoted: false   # true = ігнорувати "просунуті" (платно підняті) оголошення
  allow_similar: false   # true = враховувати підмішані OLX-ом "схожі" результати
  allow_no_price: false  # true = сповіщати й про оголошення без ціни (обмін/договірна)
  min_drop_percent: 3    # падіння ціни менше за 3% ігноруємо (щоб не смикало на копійки)
  prune_days: 30         # забути оголошення, яких не бачили N днів
  pause_between_watches: 3

  # Мерч і не-книги. Цей список ДОДАЄТЬСЯ до того, що вказано в окремому watch,
  # а не замінює його. Збіг шукається в заголовку, регістр не має значення,
  # тому корені без закінчень ловлять усі відмінки: "фігурк" → фігурка, фігурки, фігурку.
  exclude_keywords:
    - фігурк
    - паличк
    - шарф
    - значок
    - значк
    - постер
    - косплей
    - кружк
    - чашк
    - брелок
    - футболк
    - наклейк
    - лего
    - пазл
    - ps4
    - ps5
    - xbox
    - nintendo

watches:
  # Без include_keywords сюди летіли птахи, церкви України та виборчі спори:
  # зі слова «фундація» OLX робить «фундамент», «фонд» і просто книжки.
  - name: "Фундація (Азімов)"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D1%84%D1%83%D0%BD%D0%B4%D0%B0%D1%86%D1%96%D1%8F/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000
    include_keywords: ["фундаці", "азімов", "азимов", "asimov"]
    exclude_keywords: ["копія", "репринт", "друк на замовлення", "електронна"]

  # Пошук OLX нечіткий так само, як у Букфлі: на «роналду» він віддає Толкіна
  # (Джон *Роналд* Руел), Роналда Дала, Анчелотті, Пеле і стікери Panini —
  # 24 сторонніх оголошення з 40. Тому include_keywords: слово має бути в
  # заголовку. "ronaldo" — щоб не втратити англомовні видання.
  - name: "Роналду"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D1%80%D0%BE%D0%BD%D0%B0%D0%BB%D0%B4%D1%83/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000
    include_keywords: ["роналду", "ronaldo"]
    exclude_keywords: ["картина", "автограф", "толкин", "толкієн", "толкін",
                       "роналд дал", "роналд руэл", "роналд рейел", "роналд р."]

  - name: "Макс Кідрук"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BA%D1%96%D0%B4%D1%80%D1%83%D0%BA/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000

  - name: "Ден Браун"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%B4%D0%B5%D0%BD-%D0%B1%D1%80%D0%B0%D1%83%D0%BD/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000

  - name: "Відьмак"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%B2%D1%96%D0%B4%D1%8C%D0%BC%D0%B0%D0%BA/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000

  - name: "Гаррі Поттер"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%B3%D0%B0%D1%80%D1%80%D1%96-%D0%BF%D0%BE%D1%82%D1%82%D0%B5%D1%80/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000

  # ── Касандра Клер, цикл «Знаряддя смерті» ────────────────────────────────
  # Потрібні книги 2-6 (перша, «Місто кісток», уже є).
  #
  # Чому аж стільки пошуків. OLX шукає майже дослівно: оголошення «Місто
  # Кісток книга» не знаходиться ні за «кассандра клер», ні за «знаряддя
  # смерті» — у назві немає ні того, ні того. Перевірено 2026-09-17. Тому на
  # кожну книжку окремий запит, плюс два «збиральні» — на цикл і на авторку,
  # вони ловлять комплекти. Дублікати не страшні: одне оголошення = одне
  # повідомлення за прогін, навіть якщо його бачать кілька пошуків.
  #
  # OLX не вважає «Касандра» і «Кассандра» одним словом, але варіант із двома
  # «с» ширший (98 оголошень проти 22) і містить обидва написання в тексті.
  - name: "Клер: Місто попелу"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BC%D1%96%D1%81%D1%82%D0%BE-%D0%BF%D0%BE%D0%BF%D0%B5%D0%BB%D1%83/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: &clare_max 3000        # комплекти всієї серії коштують 1700-2900
    include_keywords: &clare_books
      - "місто попелу"        # City of Ashes, кн. 2
      - "місто скла"          # City of Glass, кн. 3
      - "місто впалих"        # City of Fallen Angels, кн. 4
      - "місто грішних"       # той самий переклад, інша назва
      - "місто загублених"    # City of Lost Souls, кн. 5
      - "місто небесного"     # City of Heavenly Fire, кн. 6
      - "знаряддя смерті"     # комплекти всієї серії
      - "city of ashes"
      - "city of glass"
      - "city of fallen"
      - "city of lost"
      - "city of heavenly"
    exclude_keywords: &clare_noise
      - "едгар"               # збірка По з оповіданням «Три знаряддя смерті»
      - "честертон"
      - "лімб"                # «Лімб. Місто загублених душ» — інша книжка

  - name: "Клер: Місто скла"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BC%D1%96%D1%81%D1%82%D0%BE-%D1%81%D0%BA%D0%BB%D0%B0/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  - name: "Клер: Місто впалих янголів"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BC%D1%96%D1%81%D1%82%D0%BE-%D0%B2%D0%BF%D0%B0%D0%BB%D0%B8%D1%85-%D1%8F%D0%BD%D0%B3%D0%BE%D0%BB%D1%96%D0%B2/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  - name: "Клер: Місто загублених душ"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BC%D1%96%D1%81%D1%82%D0%BE-%D0%B7%D0%B0%D0%B3%D1%83%D0%B1%D0%BB%D0%B5%D0%BD%D0%B8%D1%85-%D0%B4%D1%83%D1%88/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  - name: "Клер: Місто небесного вогню"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BC%D1%96%D1%81%D1%82%D0%BE-%D0%BD%D0%B5%D0%B1%D0%B5%D1%81%D0%BD%D0%BE%D0%B3%D0%BE-%D0%B2%D0%BE%D0%B3%D0%BD%D1%8E/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  - name: "Клер: Знаряддя смерті (цикл)"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%B7%D0%BD%D0%B0%D1%80%D1%8F%D0%B4%D0%B4%D1%8F-%D1%81%D0%BC%D0%B5%D1%80%D1%82%D1%96/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  - name: "Клер: за авторкою"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%BA%D0%B0%D1%81%D1%81%D0%B0%D0%BD%D0%B4%D1%80%D0%B0-%D0%BA%D0%BB%D0%B5%D1%80/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: *clare_max
    include_keywords: *clare_books
    exclude_keywords: *clare_noise

  # «Служниця» Фріди Мак-Фадден і продовження: «Служниця спостерігає»,
  # «Секрет служниці», «Весілля служниці». Інші її книжки («Ніколи не бреши»,
  # «Колега», «В'язень») не цікавлять, тому шукаємо за словом, а не за авторкою.
  #
  # Дві межі ціни: окрема книжка — до 199 грн, комплект — до 700. Комплект
  # розпізнається або за словом («комплект», «набір»), або за тим, що «служниц»
  # у заголовку повторюється: «Служниця спостерігає, Весілля служниці, Секрет
  # служниці» — три згадки, отже три книжки.
  - name: "Служниця (Мак-Фадден)"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D1%81%D0%BB%D1%83%D0%B6%D0%BD%D0%B8%D1%86%D1%8F/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    include_keywords: ["служниц"]
    max_price: 199              # окрема книжка
    max_price_bundle: 700       # комплект
    bundle_keywords: ["комплект", "набір", "всі частини", "усі частини",
                      "книги", "2 книги", "3 книги", "дві книги", "три книги"]

  # 27 з 40 було не по темі: довідник механізатора, залізобетонні конструкції
  # і норії НК-50 (бо «бункер» — ще й деталь зернової техніки).
  - name: "Бункер"
    url: "https://www.olx.ua/uk/hobbi-otdyh-i-sport/knigi-zhurnaly/q-%D0%B1%D1%83%D0%BD%D0%BA%D0%B5%D1%80/?currency=UAH&search%5Border%5D=created_at%3Adesc"
    max_price: 2000
    include_keywords: ["бункер"]
    exclude_keywords: ["b.u.n.k.e.r", "норія", "нория", "сепаратор", "транспортер"]

  # ── Букфлі ────────────────────────────────────────────────────────────────
  # mode: search — окремий запит на кожне ключове слово, дев'ять за прогін.
  #
  # Чому НЕ mode: latest (один запит за найновішими). Перевірено 2026-09-17:
  # з України сторінка /search віддає свіжину (оголошення того ж дня), а з
  # американських адрес GitHub Actions — зріз приблизно 14-годинної давнини.
  # Кешу немає (x-vercel-cache: MISS, no-store), маршрут інший — але набір
  # даних інший теж. Тобто «вікно найновіших» на runner'і показує вчорашній
  # день, і нові книжки в нього просто не потрапляють.
  #
  # Пошук за словом від порядку видачі не залежить узагалі: книжка знайдеться
  # хоч у свіжому зрізі, хоч у вчорашньому.
  #
  # Ціна — 9 запитів за прогін замість одного, тому перевіряємо раз на 30 хв,
  # а не щоразу разом з OLX: ~430 запитів і ~45 МБ на добу. Для книжок, які
  # висять тижнями, півгодини затримки нічого не міняють.
  # Між запитами пауза 2.5-4 с, паралельно нічого не шлеться.
  # Якщо сайт колись почне віддавати 403 — підняти до 60.
  - name: "Букфлі"
    source: bookflea
    mode: search
    interval_minutes: 30
    page_size: 24
    use_default_excludes: false   # мерч-фільтр з defaults тут зайвий: це книгарня
    keywords:
      - Роналду
      - Відьмак
      - Бункер
      - Ден Браун
      - Азімов
      - Фундація
      - Служниця
      - Кідрук
      - Гаррі Поттер
    max_price: 2000        # спільна межа-заглушка, потім налаштуєте

# Шпаргалка по параметрах watch:
#   max_price / min_price   межі ціни в гривнях
#   include_keywords        має збігтися хоча б одне слово в заголовку
#   exclude_keywords        додається до списку з defaults вище
#   cities: ["Київ"]        лише ці міста
#   pages: 2                читати більше сторінок
#   enabled: false          тимчасово вимкнути цей пошук
