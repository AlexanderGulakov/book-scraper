name: OLX watch

on:
  schedule:
    - cron: "8,24,39,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуску"
        type: choice
        default: normal
        options:
          - normal
          - dry-run
          - probe

concurrency:
  group: olx-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe (діагностика блокування)
        if: inputs.mode == 'probe'
        run: python probe.py

      - name: Run watcher
        if: inputs.mode != 'probe'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLX_BACKEND: ${{ vars.OLX_BACKEND || 'curl_cffi' }}
          OLX_IMPERSONATE: ${{ vars.OLX_IMPERSONATE || 'chrome131' }}
        run: |
          python main.py ${{ inputs.mode == 'dry-run' && '--dry-run' || '' }}

      - name: Commit state
        if: always() && inputs.mode != 'probe'
        run: |
          git config user.name  "olx-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "Змін у стані немає."
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push не вдався, спроба $i"
            sleep 5
          done
          exit 1
