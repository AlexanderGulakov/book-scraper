name: OLX watch

# Розкладом керує зовнішній планувальник (cron-job.org), який шле POST на
# .../actions/workflows/watch.yml/dispatches з тілом {"ref":"main"}.
# Власний `schedule:` GitHub тут навмисно ВИДАЛЕНО: на цьому репозиторії він за
# кілька годин не спрацював жодного разу, а якби ожив — давав би дублі, бо
# concurrency ставить другий запуск у чергу замість того, щоб його відкинути.
#
# ⚠ Відколи `main.py` ходить з `--loop`, dispatch — це НЕ «ще один прохід», а
# watchdog. Джоб сам крутить прохід щохвилини протягом 50 хвилин, бо холодний
# старт (черга раннера + checkout + pip install) коштує 1-1.5 хв, а сам прохід —
# ~40 с: платити за старт тридцять разів на годину безглуздо
# (заміри — `claude/notification-latency.md`).
#
# Роль планувальника тепер інша, і саме через неї інтервал лишається коротким:
# у групі concurrency може висіти рівно ОДИН pending-запуск (новий скасовує
# попередній pending, а той, що біжить, не чіпає). Тобто:
#   • поки цикл живий — dispatch'і просто змінюють одного й того ж pending,
#     і він стартує МИТТЄВО, щойно цикл вийде. Дірки між годинами немає;
#   • якщо цикл упав або раннер помер — наступний dispatch підніме новий
#     протягом інтервалу планувальника. Це і є «швидко відновитись».
# Ціна — скасовані запуски в історії Actions (хвилин вони не їдять, раннер для
# них не піднімається). Інтервал 2-10 хв, за смаком: частіше — швидше
# відновлення, більше сміття в списку.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуску"
        type: choice
        default: normal
        options:
          - normal      # звичайний прогін зі сповіщеннями
          - dry-run     # знайти, показати в логах, нічого не надсилати
          - probe       # діагностика 403: яка стратегія обходить блок
          - rate        # заміряти, яку частоту запитів OLX терпить З ЦЬОГО IP
          - api         # чи віддає OLX свій JSON-пошук (він ушестеро легший за HTML)

concurrency:
  group: olx-watch
  cancel-in-progress: false

# contents: write більше не потрібен — стан живе в MongoDB, а не в репо.
# Раніше тут був крок «Commit state» з git pull --rebase і трьома спробами
# push: саме він створював гонку з домашньою машиною і засмічував історію
# комітом на кожен прогін.
permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # Цикл виходить сам на 50-й хвилині; 58 — це аварійна сітка на випадок,
    # якщо він зависне в мережі. Різниця між ними навмисно велика: GitHub убиває
    # джоб по таймауту посеред чого завгодно, зокрема посеред запису стану.
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe (діагностика блокування)
        if: inputs.mode == 'probe'
        run: python probe.py

      # Заміряти паузи треба саме тут, а не вдома: репутацію має IP, і в
      # runner'а Azure вона зовсім інша, ніж у домашнього провайдера.
      # Результат каже, яким може бути `pause_between_watches` у watches.yaml.
      - name: Rate probe (яку частоту терпить OLX)
        if: inputs.mode == 'rate'
        env:
          OLX_BACKEND: ${{ vars.OLX_BACKEND || 'curl_cffi' }}
          OLX_IMPERSONATE: ${{ vars.OLX_IMPERSONATE || 'chrome131' }}
        run: python probe.py --rate

      # Головне невідоме для прискорення. HTML-сторінка пошуку коштує ~1.85 с і
      # 3.1 МБ і НЕ містить описів; той самий запит через /api/v1/offers/ дав
      # 0.4 с, 449 КБ і описи всіх 65 оголошень (заміряно з браузера 2026-10-03).
      # Але міряли з української адреси й з кукою сесії. Чи віддається те саме
      # раннеру Azure без кук — відповідає цей режим, і доки він не відповів,
      # переписувати olx.py не можна.
      - name: API probe (чи працює JSON-пошук з цієї адреси)
        if: inputs.mode == 'api'
        env:
          OLX_BACKEND: ${{ vars.OLX_BACKEND || 'curl_cffi' }}
          OLX_IMPERSONATE: ${{ vars.OLX_IMPERSONATE || 'chrome131' }}
        run: python probe.py --api

      - name: Run watcher
        if: inputs.mode != 'probe' && inputs.mode != 'rate' && inputs.mode != 'api'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Стан. Той самий рядок має бути в .env на домашній машині —
          # інакше Букфлі й OLX знову опиняться в різних базах.
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'olx_watcher' }}
          # Необов'язково — якщо хочете ще й e-mail:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          # Можна перевизначити, якщо probe покаже іншу робочу версію:
          OLX_BACKEND: ${{ vars.OLX_BACKEND || 'curl_cffi' }}
          OLX_IMPERSONATE: ${{ vars.OLX_IMPERSONATE || 'chrome131' }}
          # Аварійний відкат пошуку на HTML БЕЗ коміту: завести змінну
          # репозиторію OLX_SEARCH=html (Settings → Secrets and variables →
          # Actions → Variables). Порожнє значення означає «як у watches.yaml»,
          # де зараз `search_backend: api`.
          OLX_SEARCH: ${{ vars.OLX_SEARCH }}
        run: |
          # --skip Букфлі: книгарня віддає каталог за IP клієнта, і з
          # американської адреси runner'а це польський ринок — чужі
          # оголошення в злотих. Букфлі крутиться вдома Планувальником
          # Windows (run-bookflea.bat), але пише вже в ТУ САМУ базу.
          #
          # --storage mongo, а не auto, навмисно: якщо секрет MONGODB_URI
          # зникне, прогін має впасти з помилкою. Тихий відкат на файл
          # означав би, що стан нікуди не зберігся, а наступний прогін
          # вважав би всі оголошення новими — сорок повідомлень у Telegram.
          #
          # --loop: прохід щохвилини в ОДНОМУ процесі. Побічний виграш, крім
          # прибраного холодного старту, — сесія curl_cffi і конект до Mongo
          # живуть між проходами, тож зникає прогрів головної на кожен прохід.
          # --max-fails: п'ять невдач поспіль → вихід з кодом 1. Зламану сесію
          # чи мертвий конект наступна спроба в тому ж процесі не лікує, а
          # новий раннер — лікує; підніме його watchdog-dispatch.
          #
          # dry-run лишається одноразовим: подивитись і вийти.
          python main.py --storage mongo --skip Букфлі \
            ${{ inputs.mode == 'dry-run' && '--dry-run' || '--loop --loop-seconds 60 --deadline-minutes 50 --max-fails 5' }}
